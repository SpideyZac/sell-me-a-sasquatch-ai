[workspace]
resolver = "2"
members = ["engine", "bindings"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# The native extension is the RL environment's inner loop - every micro-step
# of every self-play episode crosses it. Whole-program optimization here is
# worth the slower builds.
[profile.release]
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: PyO3 turns a Rust panic into a Python exception via
# `catch_unwind`, which aborting would take away.
